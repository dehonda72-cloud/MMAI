<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMAI - Doniyorov Tech</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="phone-mockup">
        <div class="notch"></div>

        <div class="splash-screen">
            <div class="brain-logo-container">
                <div class="brain-logo"></div>
            </div>
            <div class="splash-title">MMAI</div>
            <div class="splash-fullname">MathMind Artificial Intelligence</div>
            <div class="splash-author">from Doniyorov Tech</div>
        </div>

        <div class="app-content">
            <div class="header">
                <div class="brand-title">MMAI</div>
                <div class="brand-subtitle">from Doniyorov Tech</div>
            </div>

            <div class="input-area">
                <textarea id="userInput" class="input-box" placeholder="Введи пример (например: 1000*1000000)..."></textarea>
            </div>

            <button class="solve-btn" id="mathBtn">Решить через MMAI</button>

            <div class="result-box">
                <div class="result-title">РЕЗУЛЬТАТ AI:</div>
                <div id="output" class="solution-text">Жду твоё уравнение, бро! Введи пример выше и нажми кнопку.</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
